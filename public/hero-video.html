<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Video Hero — Showcase</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ==========================================================================
           CINEMATIC VIDEO BACKGROUND HERO SECTION STYLES
           ========================================================================== */
        
        :root {
            --font-serif: 'DM Serif Display', Georgia, serif;
            --font-sans: 'Inter', sans-serif;
            --color-bg-dark: #050a14;
            --color-accent: #b39462; /* Premium Gold */
            --white: #ffffff;
            --white-muted: rgba(255, 255, 255, 0.65);
            --transition-cinematic: all 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg-dark);
            overflow-x: hidden;
            font-family: var(--font-sans);
        }

        /* Hero Container (90vh - 100vh) */
        .hero-video-section {
            position: relative;
            width: 100%;
            height: 95vh;
            min-height: 700px;
            overflow: hidden;
            display: flex;
            align-items: center;
            color: var(--white);
        }

        /* ----------------------------------------------------
           Layer 1: Background Video Container & Parallax
           ---------------------------------------------------- */
        .video-background-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            will-change: transform;
            transform: translate3d(0, 0, 0);
        }

        .hero-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .hero-video.loaded {
            opacity: 0.35; /* Cinematic dark exposure */
        }

        /* ----------------------------------------------------
           Layer 2: Sophisticated Cinematic Overlay Gradients
           ---------------------------------------------------- */
        .dark-cinematic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            /* Heavy dark grading on left content area, fading towards the right */
            background: linear-gradient(
                90deg,
                rgba(5, 10, 20, 0.95) 0%,
                rgba(5, 10, 20, 0.8) 35%,
                rgba(5, 10, 20, 0.5) 70%,
                rgba(5, 10, 20, 0.3) 100%
            );
        }

        /* ----------------------------------------------------
           Layer 3: Ambient Light Glows
           ---------------------------------------------------- */
        .ambient-glow-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-light-blob {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(179, 148, 98, 0.1) 0%, transparent 70%);
            mix-blend-mode: screen;
            filter: blur(120px);
            top: -100px;
            right: -100px;
            will-change: transform;
            transform: translate3d(0,0,0);
        }

        /* ----------------------------------------------------
           Layer 4: Subtle Grain / Noise Overlay
           ---------------------------------------------------- */
        .noise-grain-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.05;
            pointer-events: none;
            z-index: 4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='noise'%3e%3cfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23noise)'/%3e%3c/svg%3e");
        }

        /* ----------------------------------------------------
           Immersive Fallback: Animated 3D Floating Book Scene
           ---------------------------------------------------- */
        .animated-book-scene-fallback {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            overflow: hidden;
        }

        /* 3D floating book elements */
        .fallback-book {
            position: absolute;
            width: 100px;
            height: 150px;
            perspective: 800px;
            transform-style: preserve-3d;
            box-shadow: 10px 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translate3d(0, 50px, 0) rotateY(-15deg);
            transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 3px;
        }

        .fallback-book img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        /* Spine detail helper */
        .fallback-book::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: rgba(0,0,0,0.3);
            transform: rotateY(-90deg);
            transform-origin: left;
        }

        .fallback-book.visible {
            opacity: 0.25; /* Subtle background opacity so it doesn't distract */
        }

        /* ----------------------------------------------------
           Hero Main Grid & Content
           ---------------------------------------------------- */
        .hero-content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .hero-content-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center;
        }

        /* Cinematic Text Animations */
        .hero-text-area {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow-text {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition-cinematic);
            transition-delay: 0.3s;
        }

        /* Clip mask for line-by-line reveal */
        .heading-line-mask {
            overflow: hidden;
            margin-bottom: 8px;
        }

        .main-heading {
            font-family: var(--font-serif);
            font-size: clamp(2.8rem, 5.8vw, 5.8rem);
            line-height: 1.15;
            font-weight: 400;
            margin: 0;
        }

        .heading-reveal-inner {
            transform: translateY(100%);
            opacity: 0;
            transition: var(--transition-cinematic);
        }

        .heading-reveal-line-1 {
            transition-delay: 0.45s;
        }
        .heading-reveal-line-2 {
            transition-delay: 0.6s;
        }

        .main-heading span.accent-word {
            color: var(--color-accent);
            font-style: italic;
        }

        .hero-description-mask {
            overflow: hidden;
            margin-top: 24px;
            margin-bottom: 40px;
        }

        .hero-description {
            font-size: clamp(1rem, 1.25vw, 1.25rem);
            line-height: 1.7;
            color: var(--white-muted);
            max-width: 580px;
            transform: translateY(100%);
            opacity: 0;
            transition: var(--transition-cinematic);
            transition-delay: 0.75s;
        }

        /* Buttons Stagger */
        .buttons-row {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .btn-cinematic-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: var(--white);
            color: var(--color-bg-dark);
            border: none;
            padding: 16px 36px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: 0.9s;
        }

        .btn-cinematic-primary svg {
            transition: transform 0.3s ease;
        }

        .btn-cinematic-primary:hover {
            background-color: var(--color-accent);
            color: var(--color-bg-dark);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(179, 148, 98, 0.35);
        }

        .btn-cinematic-primary:hover svg {
            transform: translateX(6px);
        }

        .btn-cinematic-secondary {
            display: inline-block;
            border: 1.5px solid rgba(255,255,255,0.2);
            color: var(--white);
            padding: 15px 36px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 4px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: 1.02s;
            background: transparent;
        }

        .btn-cinematic-secondary:hover {
            border-color: var(--white);
            background-color: rgba(255,255,255,0.05);
            transform: translateY(-3px);
        }

        /* ----------------------------------------------------
           Decorative elements: Scroll Vertical text & Lines
           ---------------------------------------------------- */
        .vertical-scroll-action {
            position: absolute;
            left: 40px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 100;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s ease 1.2s;
        }

        .vertical-scroll-action.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .vertical-text {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--white-muted);
            writing-mode: vertical-lr;
            transform: rotate(180deg);
        }

        .scroll-line-indicator {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--color-accent), transparent);
            position: relative;
            overflow: hidden;
        }

        /* Scroll tick animation */
        .scroll-line-indicator::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            background-color: var(--white);
            animation: scrollTick 2s infinite cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scrollTick {
            0% { top: -20px; }
            100% { top: 60px; }
        }

        /* ----------------------------------------------------
           Bottom Statistics Overlay
           ---------------------------------------------------- */
        .hero-bottom-stats-container {
            position: absolute;
            bottom: 60px;
            right: 80px;
            display: flex;
            gap: 60px;
            z-index: 100;
        }

        .hero-stat-box {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition-delay: 1.2s;
        }

        .hero-stat-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-stat-number {
            font-family: var(--font-serif);
            font-size: 2.2rem;
            font-weight: 400;
            color: var(--color-accent);
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .hero-stat-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--white-muted);
        }

        /* Active Entry Animations when loaded */
        .hero-video-section.loaded .eyebrow-text {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-video-section.loaded .heading-reveal-inner {
            transform: translateY(0);
            opacity: 1;
        }

        .hero-video-section.loaded .hero-description {
            transform: translateY(0);
            opacity: 1;
        }

        .hero-video-section.loaded .btn-cinematic-primary {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-video-section.loaded .btn-cinematic-secondary {
            opacity: 1;
            transform: translateY(0);
        }

        /* ----------------------------------------------------
           RESPONSIVE DESIGN BREAKPOINTS
           ---------------------------------------------------- */
        
        @media (max-width: 992px) {
            .hero-video-section {
                height: auto;
                min-height: 100vh;
                padding: 120px 0 160px;
            }
            .hero-content-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-text-area {
                align-items: center;
            }
            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }
            .buttons-row {
                justify-content: center;
                width: 100%;
            }
            .vertical-scroll-action {
                display: none; /* Hide vertical action lines on small layouts */
            }
            .hero-bottom-stats-container {
                position: relative;
                bottom: auto;
                right: auto;
                margin-top: 60px;
                justify-content: center;
                width: 100%;
            }
        }

        @media (max-width: 576px) {
            .hero-video-section {
                padding: 100px 0 180px;
            }
            .buttons-row {
                flex-direction: column;
                width: 100%;
                gap: 15px;
            }
            .buttons-row a {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
            .hero-bottom-stats-container {
                flex-direction: column;
                gap: 30px;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- Cinematic Video Hero Showcase -->
    <section class="hero-video-section" id="videoHero">
        <!-- Layer 1: Background Video container -->
        <div class="video-background-container" id="videoContainer">
            <video class="hero-video" id="booksBgVideo" autoplay muted loop playsinline preload="metadata" poster="https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=1600&h=900&fit=crop">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-turning-pages-of-a-book-close-up-15941-large.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Layer 2: Dark Cinematic Gradient Overlay -->
        <div class="dark-cinematic-overlay"></div>

        <!-- Layer 3: Ambient Light Glows -->
        <div class="ambient-glow-layer">
            <div class="ambient-light-blob" id="lightBlob"></div>
        </div>

        <!-- Layer 4: noise grain layer -->
        <div class="noise-grain-layer"></div>

        <!-- Immersive Fallback: Animated 3D Floating Book Scene -->
        <div class="animated-book-scene-fallback" id="bookSceneFallback">
            <!-- 8-12 Floating layered elements generated dynamically or structured in DOM -->
            <div class="fallback-book" style="top: 15%; left: 55%; width: 120px; height: 180px; transition-delay: 0.1s;" data-depth="0.3">
                <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=300&h=450&fit=crop" alt="Floating book cover">
            </div>
            <div class="fallback-book" style="top: 45%; left: 75%; width: 110px; height: 165px; transition-delay: 0.3s;" data-depth="0.6">
                <img src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=300&h=450&fit=crop" alt="Floating book cover">
            </div>
            <div class="fallback-book" style="top: 25%; left: 85%; width: 90px; height: 135px; transition-delay: 0.5s;" data-depth="0.9">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?w=300&h=450&fit=crop" alt="Floating book cover">
            </div>
            <div class="fallback-book" style="top: 65%; left: 60%; width: 100px; height: 150px; transition-delay: 0.2s;" data-depth="0.4">
                <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?w=300&h=450&fit=crop" alt="Floating book cover">
            </div>
            <div class="fallback-book" style="top: 5%; left: 70%; width: 80px; height: 120px; transition-delay: 0.6s;" data-depth="0.75">
                <img src="https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=300&h=450&fit=crop" alt="Floating book cover">
            </div>
            <div class="fallback-book" style="top: 75%; left: 88%; width: 95px; height: 140px; transition-delay: 0.4s;" data-depth="0.5">
                <img src="https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=300&h=450&fit=crop" alt="Floating book cover">
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="container hero-content-wrapper">
            <div class="hero-content-grid">
                
                <!-- Left text controls -->
                <div class="hero-text-area">
                    <span class="eyebrow-text">Curated Stories • Endless Possibilities</span>
                    
                    <!-- Line-by-line staggered text reveals -->
                    <div class="heading-line-mask">
                        <h1 class="main-heading"><div class="heading-reveal-inner heading-reveal-line-1">Discover Stories</div></h1>
                    </div>
                    <div class="heading-line-mask">
                        <h1 class="main-heading"><div class="heading-reveal-inner heading-reveal-line-2">That <span class="accent-word">Stay With You.</span></div></h1>
                    </div>

                    <div class="hero-description-mask">
                        <p class="hero-description">Explore carefully selected books, timeless stories, and unforgettable ideas waiting to become part of your world.</p>
                    </div>

                    <div class="buttons-row">
                        <a href="books.html" class="btn-cinematic-primary">
                            Explore Collection
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </a>
                        <a href="best-sellers.html" class="btn-cinematic-secondary">View Best Sellers</a>
                    </div>
                </div>

            </div>
        </div>

        <!-- Left Side Scroll Indicator -->
        <div class="vertical-scroll-action" id="scrollIndicator">
            <span class="vertical-text">Scroll to explore</span>
            <div class="scroll-line-indicator"></div>
        </div>

        <!-- Bottom Statistics panel -->
        <div class="hero-bottom-stats-container">
            <div class="hero-stat-box" id="statBox1">
                <div class="hero-stat-number" data-val="50000">0</div>
                <div class="hero-stat-label">Happy Readers</div>
            </div>
            <div class="hero-stat-box" id="statBox2">
                <div class="hero-stat-number" data-val="10000">0</div>
                <div class="hero-stat-label">Books Available</div>
            </div>
            <div class="hero-stat-box" id="statBox3">
                <div class="hero-stat-number" data-val="4.9">0</div>
                <div class="hero-stat-label">Reader Rating</div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ==========================================================================
        // CINEMATIC VIDEO BACKGROUND HERO JAVASCRIPT
        // ==========================================================================

        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.getElementById('videoHero');
            const video = document.getElementById('booksBgVideo');
            const scrollInd = document.getElementById('scrollIndicator');
            const statBoxes = document.querySelectorAll('.hero-stat-box');
            const lightBlob = document.getElementById('lightBlob');
            const videoContainer = document.getElementById('videoContainer');
            const fallbackBooks = document.querySelectorAll('.fallback-book');

            // 1. Listen for video loadedmetadata to transition in background exposure
            if (video) {
                video.addEventListener('loadeddata', () => {
                    video.classList.add('loaded');
                });
                
                // Fallback timeout in case video CDN is blocked or slow
                setTimeout(() => {
                    if (!video.classList.contains('loaded')) {
                        video.classList.add('loaded'); // Force fade in of poster frame
                    }
                }, 2000);
            }

            // 2. Cinematic Page-load entry sequence
            setTimeout(() => {
                // Add class triggering line reveals and button fades
                hero.classList.add('loaded');

                // Display scroll and stats overlays
                if (scrollInd) scrollInd.classList.add('visible');
                statBoxes.forEach(box => box.classList.add('visible'));

                // Reveal fallback book elements
                fallbackBooks.forEach(book => book.classList.add('visible'));

                // Start numbers animation
                animateStats();
            }, 300);

            // 3. Floating 3D Book drifts & parallax checks
            let floatTime = 0;
            function animateDriftingBooks() {
                floatTime += 0.008;
                fallbackBooks.forEach((book, idx) => {
                    const depth = parseFloat(book.getAttribute('data-depth')) || 0.5;
                    const indexOffset = idx * 1.5;
                    
                    // Natural sinusoidal path drift
                    const yDrift = Math.sin(floatTime + indexOffset) * 15 * depth;
                    const xDrift = Math.cos((floatTime * 0.7) + indexOffset) * 10 * depth;
                    const zRotate = Math.sin((floatTime * 0.5) + indexOffset) * 5 * depth;

                    // Apply coordinate mappings
                    book.style.transform = `translate3d(${xDrift}px, ${yDrift}px, 0) rotateY(-15deg) rotateZ(${zRotate}deg)`;
                });

                requestAnimationFrame(animateDriftingBooks);
            }
            requestAnimationFrame(animateDriftingBooks);

            // 4. Smooth Mouse Parallax (Moves ambient glows, video container, and floating layers)
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;

            const isMobile = window.matchMedia("(max-width: 992px)");

            if (!isMobile.matches) {
                document.addEventListener('mousemove', (e) => {
                    // Normalize position -1 to 1 around screen center
                    targetX = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                    targetY = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
                });

                function interpolationParallaxLoop() {
                    // Linear interpolation (lerp)
                    mouseX += (targetX - mouseX) * 0.05;
                    mouseY += (targetY - mouseY) * 0.05;

                    // Shift background video container slightly opposite
                    if (videoContainer) {
                        const shiftX = mouseX * -20;
                        const shiftY = mouseY * -20;
                        videoContainer.style.transform = `translate3d(${shiftX}px, ${shiftY}px, 0)`;
                    }

                    // Shift ambient lighting glow
                    if (lightBlob) {
                        const blobX = mouseX * 50;
                        const blobY = mouseY * 50;
                        lightBlob.style.transform = `translate3d(${blobX}px, ${blobY}px, 0)`;
                    }

                    // Stagger shift drifting books based on depth speed modifiers
                    fallbackBooks.forEach(book => {
                        const depth = parseFloat(book.getAttribute('data-depth')) || 0.5;
                        const bookX = mouseX * depth * 35;
                        const bookY = mouseY * depth * 35;
                        // Retrieve previous floating transform to combine safely
                        book.style.marginLeft = `${bookX}px`;
                        book.style.marginTop = `${bookY}px`;
                    });

                    requestAnimationFrame(interpolationParallaxLoop);
                }
                requestAnimationFrame(interpolationParallaxLoop);
            }

            // 5. Scroll statistics numbers animation
            function animateStats() {
                const numbers = document.querySelectorAll('.hero-stat-number');
                numbers.forEach(elem => {
                    const target = parseFloat(elem.getAttribute('data-val'));
                    const isDecimal = target % 1 !== 0;
                    const duration = 2000;
                    const steps = 60;
                    const increment = target / steps;
                    let current = 0;
                    let frame = 0;

                    const timer = setInterval(() => {
                        frame++;
                        current += increment;
                        if (frame >= steps) {
                            clearInterval(timer);
                            elem.textContent = isDecimal ? target.toFixed(1) + '/5' : target.toLocaleString() + '+';
                        } else {
                            elem.textContent = isDecimal ? current.toFixed(1) + '/5' : Math.floor(current).toLocaleString() + '+';
                        }
                    }, duration / steps);
                });
            }
        });
    </script>
</body>
</html>
