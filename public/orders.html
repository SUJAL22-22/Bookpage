<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LUMORA BOOKS - View your orders and track shipments">
    <title>My Orders — LUMORA BOOKS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/orders.css">
</head>
<body>
    <header class="orders-header">
        <div class="orders-header-container">
            <a href="/" class="back-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                BACK TO HOME
            </a>
            <a href="/" class="orders-logo">LUMORA</a>
            <div class="orders-title">MY ORDERS</div>
        </div>
    </header>

    <main class="orders-main container">
        <div class="orders-container" id="ordersContainer">
            <div class="orders-loading">
                <p>Loading your orders...</p>
            </div>
        </div>

        <!-- Empty State -->
        <div class="orders-empty" id="ordersEmpty" style="display: none;">
            <div class="empty-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
            </div>
            <h2>No Orders Yet</h2>
            <p>You haven't placed any orders. Start exploring our collection!</p>
            <a href="/books.html" class="btn btn-primary hover-lift">BROWSE BOOKS</a>
        </div>
    </main>

    <footer class="orders-footer">
        <p>&copy; 2026 LUMORA BOOKS. All Rights Reserved.</p>
    </footer>

    <script src="/js/script.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
